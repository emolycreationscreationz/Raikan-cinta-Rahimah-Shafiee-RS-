<!-- ============ Pintu pembuka ============ -->
<div class="pintu" id="pintu">
  <div class="pintu__daun pintu__daun--kiri"></div>
  <div class="pintu__daun pintu__daun--kanan"></div>
  <div class="pintu__tengah">
    <button type="button" class="meterai" id="bukaJemputan" aria-label="Buka jemputan">
      <span data-f="initials">RS</span>
    </button>
    <p class="pintu__hint">Sentuh untuk buka</p>
  </div>
</div>

<canvas class="kelopak" id="kelopak" aria-hidden="true"></canvas>

<main class="kad" id="kad">

  <!-- Muka depan -->
  <section class="muka" id="muka">
    <svg class="bunga bunga--tl" viewBox="0 0 220 280" aria-hidden="true"><use href="#spray" width="220" height="280"/></svg>
    <svg class="bunga bunga--tr" viewBox="0 0 220 280" aria-hidden="true"><g transform="translate(220 0) scale(-1 1)"><use href="#spray" width="220" height="280"/></g></svg>
    <svg class="bunga bunga--bl" viewBox="0 0 220 280" aria-hidden="true"><g transform="translate(0 280) scale(1 -1)"><use href="#spray" width="220" height="280"/></g></svg>
    <svg class="bunga bunga--br" viewBox="0 0 220 280" aria-hidden="true"><g transform="translate(220 280) scale(-1 -1)"><use href="#spray" width="220" height="280"/></g></svg>

    <div class="muka__isi">
      <p class="eyebrow" data-f="tajuk"></p>
      <h1 class="initials" data-f="initials"></h1>
      <p class="pasangan" data-f="pasanganPendek"></p>
      <span class="garis" aria-hidden="true"></span>
      <p class="tarikh" data-f="tarikhPaparan"></p>
    </div>
    <a class="muka__turun" href="#jemputan" aria-label="Skrol ke jemputan"><svg><use href="#i-bawah"/></svg></a>
  </section>

  <!-- Jemputan -->
  <section class="seksyen jemputan" id="jemputan">
    <svg class="bunga-sisi bunga-sisi--kiri" viewBox="0 0 220 280" aria-hidden="true"><use href="#spray" width="220" height="280"/></svg>
    <p class="bismillah reveal" lang="ar" dir="rtl">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
    <p class="pembuka reveal" data-f="pembuka"></p>
    <p class="ibubapa reveal"><span data-f="bapa"></span><span class="dan">&amp;</span><span data-f="ibu"></span></p>
    <p class="jemput reveal" data-f="jemputan"></p>
    <p class="kemajlis reveal" data-f="keMajlis"></p>
    <h2 class="nama-skrip reveal"><span data-f="pengantinPerempuan"></span><span class="dan">&amp;</span><span data-f="pengantinLelaki"></span></h2>
    <svg class="ranting reveal" viewBox="0 0 140 34" aria-hidden="true"><use href="#sprig" width="140" height="34"/></svg>
    <p class="tarikh reveal" data-f="tarikhPaparan"></p>
    <div class="kira reveal" id="kiraDetik" role="timer" aria-label="Kiraan detik ke majlis">
      <div class="kira__kotak"><b data-k="hari">0</b><span>Hari</span></div>
      <div class="kira__kotak"><b data-k="jam">00</b><span>Jam</span></div>
      <div class="kira__kotak"><b data-k="minit">00</b><span>Minit</span></div>
      <div class="kira__kotak"><b data-k="saat">00</b><span>Saat</span></div>
    </div>
  </section>

      <p class="alamat" id="alamatTempat"></p>
    </div>
    <div class="butiran__blok reveal">
      <svg class="ikon"><use href="#i-jam"/></svg>
      <p class="masa" data-f="masa"></p>
    </div>

    </svg>

    <ul class="aturcara reveal" id="aturcara"></ul>
  </section>

  <!-- Doa -->
  <section class="seksyen doa" id="doa">
    <div class="doa__kad reveal">
      <svg class="ranting ranting--kecil" viewBox="0 0 140 34" aria-hidden="true"><use href="#sprig" width="140" height="34"/></svg>
      <div class="doa__teks" id="doaTeks"></div>
      <p class="doa__amin" data-f="doaPenutup"></p>
      <p class="doa__hashtag" data-f="hashtag"></p>
    </div>
  </section>

  <!-- Galeri -->
  <section class="galeri" id="galeri" aria-label="Galeri gambar">
    <div class="galeri__trek" id="galeriTrek"></div>
    <div class="galeri__titik" id="galeriTitik"></div>
  </section>

  <!-- RSVP -->
  <section class="seksyen rsvp" id="rsvp">
    <h2 class="tajuk-skrip reveal">RSVP</h2>
    <div class="rsvp__stat reveal">
      <div><span>Hadir</span><b id="kiraHadir">–</b></div>
      <div><span>Tidak Hadir</span><b id="kiraTidak">–</b></div>
    </div>
    <button type="button" class="btn-pil reveal" data-buka="modalRsvp">ISI RSVP &amp; UCAPAN</button>
  </section>

  <!-- Guest Book -->
  <section class="seksyen ucapan" id="ucapan">
    <h2 class="tajuk-skrip reveal">Guest Book</h2>
    <div class="ucapan__kad reveal" id="senaraiUcapan" tabindex="0" aria-label="Ucapan tetamu" aria-live="polite">
      <p class="ucapan__kosong">Memuatkan ucapan…</p>
    </div>
  </section>

  <!-- Penutup -->
  <section class="seksyen penutup">
    <p class="penutup__teks reveal" data-f="penutup"></p>
    <p class="penutup__terima reveal" data-f="terimaKasih"></p>
    <svg class="ranting reveal" viewBox="0 0 140 34" aria-hidden="true"><use href="#sprig" width="140" height="34"/></svg>
    <p class="penutup__direka reveal">Direka Oleh</p>
    <p class="penutup__jenama reveal" data-f="direkaOleh"></p>
  </section>
</main>

<!-- ============ Bar bawah ============ -->
<nav class="bar" aria-label="Menu jemputan">
  <button type="button" data-buka="sheetHubungi"><svg><use href="#i-telefon"/></svg><span>Hubungi</span></button>
  <button type="button" data-buka="modalLokasi"><svg><use href="#i-lokasi"/></svg><span>Lokasi</span></button>
  <button type="button" data-buka="modalRsvp"><svg><use href="#i-rsvp"/></svg><span>RSVP</span></button>
  <button type="button" id="btnRefresh"><svg><use href="#i-refresh"/></svg><span>Refresh</span></button>
</nav>

<button type="button" class="muzik" id="btnMuzik" aria-label="Main atau henti muzik" aria-pressed="false">
  <span></span><span></span><span></span><span></span>
</button>
<audio id="lagu" loop preload="none"></audio>

<!-- ============ Hubungi (helaian bawah) ============ -->
<div class="lapisan lapisan--bawah" id="sheetHubungi" role="dialog" aria-modal="true" aria-labelledby="tHubungi">
  <div class="helaian">
    <span class="helaian__pemegang" aria-hidden="true"></span>
    <h3 id="tHubungi">HUBUNGI</h3>
    <ul class="hubungi" id="senaraiHubungi"></ul>
    <button type="button" class="btn-teks" data-tutup>Tutup</button>
  </div>
</div>

<!-- ============ Lokasi ============ -->
<div class="lapisan" id="modalLokasi" role="dialog" aria-modal="true" aria-labelledby="tLokasi">
  <div class="dialog">
    <button type="button" class="dialog__x" data-tutup aria-label="Tutup"><svg><use href="#i-tutup"/></svg></button>
    <h3 id="tLokasi">LOKASI</h3>
    <p class="lokasi__nama" id="lokasiNama"></p>
    <p class="lokasi__alamat" id="lokasiAlamat"></p>
    <div class="lokasi__butang">
      <a class="btn-garis" id="lnkMaps" target="_blank" rel="noopener"><svg><use href="#i-lokasi"/></svg>Google Maps</a>
      <a class="btn-garis" id="lnkWaze" target="_blank" rel="noopener" hidden>Waze</a>
    </div>
  </div>
</div>

<!-- ============ Borang RSVP ============ -->
<div class="lapisan" id="modalRsvp" role="dialog" aria-modal="true" aria-labelledby="tRsvp">
  <form class="dialog borang" id="borangRsvp" novalidate>
    <h3 id="tRsvp">RSVP</h3>
    <label for="fNama">Nama :</label>
    <input id="fNama" name="nama" type="text" autocomplete="name" maxlength="60" required>
    <label for="fHadir">Kehadiran :</label>
    <select id="fHadir" name="kehadiran" required>
      <option value="">Pilih</option>
      <option value="Hadir">Hadir</option>
      <option value="Tidak Hadir">Tidak Hadir</option>
    </select>
    <label for="fPax">Jumlah Pax (termasuk anda) :</label>
    <select id="fPax" name="pax"></select>
    <label for="fUcapan">Ucapan :</label>
    <textarea id="fUcapan" name="ucapan" rows="3" maxlength="300" placeholder="Tahniah…"></textarea>
    <p class="borang__ralat" id="borangRalat" role="alert"></p>
    <div class="borang__butang">
      <button type="submit" class="btn-utama" id="btnHantar">HANTAR</button>
      <button type="button" class="btn-kedua" data-tutup>TUTUP</button>
    </div>
  </form>
</div>

<!-- ============ Lightbox gambar ============ -->
<div class="lapisan lapisan--gambar" id="lightbox" role="dialog" aria-modal="true" aria-label="Gambar">
