<!-- ============ Borang RSVP ============ -->
<div class="lapisan" id="modalRsvp" role="dialog" aria-modal="true" aria-labelledby="tRsvp">
  <form class="dialog borang" id="borangRsvp" novalidate>
    <h3 id="tRsvp">RSVP</h3>
    <label for="fNama">Nama :</label>
    <input id="fNama" name="nama" type="text" autocomplete="name" maxlength="60" required>
    <label for="fHadir">Kehadiran :</label>
    <select id="fHadir" name="kehadiran" required>
      <option value="">Pilih</option>
      <option value="Hadir">Hadir</option>
      <option value="Tidak Hadir">Tidak Hadir</option>
    </select>
    <label for="fPax">Jumlah Pax (termasuk anda) :</label>
    <select id="fPax" name="pax"></select>
    <label for="fUcapan">Ucapan :</label>
    <textarea id="fUcapan" name="ucapan" rows="3" maxlength="300" placeholder="Tahniah…"></textarea>
    <p class="borang__ralat" id="borangRalat" role="alert"></p>
    <div class="borang__butang">
      <button type="submit" class="btn-utama" id="btnHantar">HANTAR</button>
      <button type="button" class="btn-kedua" data-tutup>TUTUP</button>
    </div>
  </form>
</div>

<!-- ============ Lightbox gambar ============ -->
<div class="lapisan lapisan--gambar" id="lightbox" role="dialog" aria-modal="true" aria-label="Gambar">
  <button type="button" class="dialog__x dialog__x--terang" data-tutup aria-label="Tutup"><svg><use href="#i-tutup"/></svg></button>
  <img id="lightboxImg" alt="">
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
